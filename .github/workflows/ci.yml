# CI workflow: builds Docker image and emits GitHub Deployment events for Backtrack
name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint / test
        run: echo "tests passed"

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: "Deploy food-delivery-microservices ${{ steps.sha.outputs.short }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-microservices:${{ steps.sha.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/food-delivery-microservices:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          description: "Image zeritzuu/food-delivery-microservices:${{ steps.sha.outputs.short }} deployed"

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
          description: "Build or push failed for ${{ steps.sha.outputs.short }}"
